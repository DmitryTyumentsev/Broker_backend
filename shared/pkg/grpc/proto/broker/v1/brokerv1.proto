syntax = "proto3";

package broker.v1;

import "google/protobuf/timestamp.proto";

service BrokerService{
  rpc CreateCustomerFixation(FixationCustomerRequest) returns (FixationCustomerResponse);
}

message FixationCustomerRequest{
  string broker_id = 1;
  string customer_id = 2;
  string fix_for = 3;
  string fixed_by = 4;
}

message FixationCustomerResponse{
  string fixation_id = 1;
  string status = 2;
  google.protobuf.Timestamp fixed_at = 3;
  google.protobuf.Timestamp expires_at = 4;
}
