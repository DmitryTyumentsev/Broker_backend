syntax = "proto3";

package v1;

service AuthService{
  rpc Register(RegisterRequest) returns(AuthPair);
  rpc Auth(AuthRequest) returns(AuthPair);
  rpc Refresh(RefreshRequest) returns(AuthPair);
  rpc Logout(RefreshRequest) returns(LogoutResponse);
}

message RegisterRequest{
  string email = 1;
  string password = 2;
  string username = 3;
  string device_id = 4;
}

message AuthRequest{
  string username = 1;
  string password = 2;
  string device_id = 3;
}

message RefreshRequest{
  string refresh_token = 1;
  string device_id = 2;
}

message AuthPair{
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in_sec = 3;
}

message LogoutResponse{
  bool all_device = 1;
  string device_id = 2;
}