# fixationservice, dev: сервис запущен внутри compose, поэтому хосты —
# имена сервисов из docker-compose.yml, а не 127.0.0.1.

environment: dev

server:
  host: 0.0.0.0
  port: 50052          # gRPC, совпадает с partnerapi fixation_grpc.address

business:
  context_timeout: 5s
  fixation_duration: 1440h
  hash_secret: ""      # берётся из FIXATIONSERVICE_BUSINESS_HASH_SECRET

observability:
  tracing:
    enabled: true
    service_name: "fixationservice"
    otlp_endpoint: "jaeger:4317"
    insecure: true
    sample_ratio: 0.1   # в dev пишем каждый десятый трейс: их слишком много

database:
  postgres:
    dsn: "postgres://go_user:go_user@postgres:5432/broker?sslmode=disable&search_path=integration,public"

    host: "postgres"
    port: 5432
    database_name: "broker"
    username: "go_user"
    password: ""        # берётся из FIXATIONSERVICE_DATABASE_POSTGRES_PASSWORD
    ssl_mode: "disable"

    migrations_path: "migrations/integration"
    migrations_table: "goose_db_version"
    schema_name: "integration"

    max_connections: 20
    min_connections: 2
    max_idle_time: 5m
    max_lifetime: 1h
    health_check_period: 1m

    connect_timeout: 5s
    read_timeout: 3s
    write_timeout: 3s
