# authservice, dev: сервис запущен внутри compose.

environment: dev

server:
  host: "0.0.0.0"
  port: 50051
  read_timeout: "5s"
  write_timeout: "5s"
  idle_timeout: "60s"

business:
  context_timeout: "5s"
  lifetime_access_token: "15m"
  lifetime_refresh_token: "720h"
  access_token_alg: "HS256"
  access_token_type: "JWT"
  access_token_secret: ""     # берётся из AUTHSERVICE_BUSINESS_ACCESS_TOKEN_SECRET
  access_token_issuer: "authservice"

observability:
  tracing:
    enabled: true
    service_name: "authservice"
    otlp_endpoint: "jaeger:4317"
    insecure: true
    sample_ratio: 0.1

database:
  postgres:
    dsn: "postgres://app_user:app_user@postgres:5432/broker?sslmode=disable&search_path=app,public"

    host: "postgres"
    port: 5432
    database_name: "broker"
    username: "app_user"
    password: ""              # берётся из AUTHSERVICE_DATABASE_POSTGRES_PASSWORD
    ssl_mode: "disable"

    migrations_path: "migrations/app"
    migrations_table: "goose_db_version"
    schema_name: "app"

    max_connections: 10
    min_connections: 1
    max_idle_time: "30m"
    max_lifetime: "60m"
    health_check_period: "5m"
    write_timeout: "30s"
    read_timeout: "15s"
    connect_timeout: "5s"

  redis:
    host: "redis"
    port: 6379
    password: ""
    db: 0
    dial_timeout: "5s"
    read_timeout: "3s"
    write_timeout: "3s"
    pool_size: 10
    min_idle_conns: 2
