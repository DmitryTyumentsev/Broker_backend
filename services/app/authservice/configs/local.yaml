# authservice, локальный запуск: инфраструктура в docker, сервис на хосте.
#
# ВАЖНО про DSN. authservice играет роль контура монолита и ходит в базу
# под ролью app_user: полные права на схему app, только select на
# integration. Зеркально go_user у fixationservice — это и есть граница
# двух контуров, и держит её база, а не договорённость.

environment: local

server:
  host: "0.0.0.0"
  port: 50051
  read_timeout: "5s"
  write_timeout: "5s"
  idle_timeout: "60s"

business:
  context_timeout: "5s"
  lifetime_access_token: "15m"
  lifetime_refresh_token: "720h"
  access_token_alg: "HS256"
  access_token_type: "JWT"
  # Один и тот же секрет у authservice (выпускает) и partnerapi (проверяет).
  access_token_secret: "local-access-secret-change-me-32-bytes-minimum"
  access_token_issuer: "authservice"

observability:
  tracing:
    enabled: true
    service_name: "authservice"
    otlp_endpoint: "localhost:4317"
    insecure: true
    sample_ratio: 1

database:
  postgres:
    dsn: "postgres://app_user:app_user@127.0.0.1:5432/broker?sslmode=disable&search_path=app,public"

    host: "127.0.0.1"
    port: 5432
    database_name: "broker"
    username: "app_user"
    password: "app_user"
    ssl_mode: "disable"

    migrations_path: "migrations/app"
    migrations_table: "goose_db_version"
    schema_name: "app"        # → app.goose_db_version

    max_connections: 10
    min_connections: 1
    max_idle_time: "30m"
    max_lifetime: "60m"
    health_check_period: "5m"
    write_timeout: "30s"
    read_timeout: "15s"
    connect_timeout: "5s"

  redis:
    host: "127.0.0.1"
    port: 6379
    password: ""
    db: 0
    dial_timeout: "5s"
    read_timeout: "3s"
    write_timeout: "3s"
    pool_size: 10
    min_idle_conns: 2
