environment: local

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  body_limit_bytes: 2097152

business:
  context_timeout: 5s
  request_timeout: 8s
  operation_timeout: 5s
  access_token_secret: "local-access-secret-change-me-32-bytes-minimum"
  access_token_issuer: "authservice"
  auth_rate_limit:
    enabled: true
    limit: 20
    window: 1m
    prefix: "rl:auth"
  default_rate_limit:
    enabled: true
    limit: 120
    window: 1m
    prefix: "rl:api"
  idempotency:
    enabled: true
    ttl: 24h
    header: "Idempotency-Key"
    lock_prefix: "idem:api"
    max_response_bytes: 262144
  protected_allowed_roles:
    - superadmin # а зачем ставим тире? например в поле header тут выше строка идет в кавычках, а тут тире. Как это работает, в чем логика?
    - developer_admin
    - account_manager # чем может по логике в целом роль аккаунта отличаться от роли суперадмина и девелопер админа? как ты думаешь есть ли смысл делить, ради каких разделов? мне только закрепление за аккаунтом брокера приходит в голову и то в этом даже сомневаюсь немного. Немного не ложится картинка - у застройщика есть партнерский отдел который работает с брокерами. К ним приходит брокер, надо закрепить за ним аккаунта. Допустим делаем это в нашей crm. А сами аккаунты где работают? в своей отдельной crm типа амо? мы должны как-то связывать эти системы и если да то в чем? вот это немного не ложится в картину. в голову приходит пример с закреплением брокера за аккаунтами - мы должны в двух системах крепить выходит? даже скорее в amo крепим, а сюда летит по апи запрос на закрепление и это транзакция?
    - sales_manager
    - agency_owner
    - broker_team_lead
    - broker_team_member
  developer_admin_allowed_roles:
    - superadmin
    - developer_admin
  broker_admin_allowed_roles:
    - agency_owner
  broker_team_lead_allowed_roles:
    - broker_team_lead
  broker_manager_allowed_roles:
    - broker_team_member

http:
  cors:
    enabled: true
    allow_origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
    allow_methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allow_headers:
      - Authorization
      - Content-Type
      - X-Request-ID
      - Idempotency-Key
    expose_headers:
      - X-Request-ID
      - X-RateLimit-Limit
      - X-RateLimit-Remaining
      - Retry-After
    allow_credentials: true
    max_age_seconds: 600
  security_headers:
    enabled: true

observability:
  metrics:
    enabled: true
    path: "/metrics"
  tracing:
    enabled: true
    service_name: "apigateway"
    otlp_endpoint: "localhost:4317"
    insecure: true
    sample_ratio: 1

auth_grpc:
  address: localhost:50051

database:
  redis:
    host: "127.0.0.1"
    port: 6379
    password: ""
    db: 0
    dial_timeout: "5s"
    read_timeout: "3s"
    write_timeout: "3s"
    pool_size: 10
    min_idle_conns: 2
