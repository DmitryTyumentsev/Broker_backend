# deploy/alerts.yml
#
# Правила алертов. Подключаются через rule_files в prometheus.yml,
# пересчитываются каждые evaluation_interval. Alertmanager на стенде нет:
# состояние правил смотрим на http://localhost:9090/alerts, там же видно
# pending → firing и через сколько сработает.
#
# Проверить синтаксис, не поднимая стенд:
#   docker run --rm -v "$PWD/deploy:/deploy" prom/prometheus:v2.33.0 \
#     promtool check rules /deploy/alerts.yml
#
# for: — не украшение. Без него любой одиночный скрейп-промах поднимает
# алерт, а алерт, который врёт, через неделю перестают читать.

groups:
  # ── Живость ──────────────────────────────────────────────────────────
  - name: liveness
    rules:
      - alert: PartnerAPIDown
        expr: up{job="partnerapi"} == 0
        for: 2m
        labels:
          severity: critical
          contour: go
        annotations:
          summary: "partnerapi не отвечает на /metrics"
          description: "Prometheus не может снять метрики с {{ $labels.instance }} уже 2 минуты."

      - alert: RabbitMQDown
        expr: up{job="rabbitmq"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ не отдаёт метрики"
          description: "Шина между монолитом и Go недоступна для мониторинга: {{ $labels.instance }}."

  # ── Шина ─────────────────────────────────────────────────────────────
  - name: bus
    rules:
      # Растущая очередь — первый признак того, что консьюмер встал.
      # Порог стендовый: на 10 RPS столько неразобранных сообщений
      # означает, что разбирать их некому.
      - alert: QueueNotDraining
        expr: rabbitmq_queue_messages_ready > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Очередь {{ $labels.queue }} не разбирается"
          description: "Больше 1000 неразобранных сообщений пять минут подряд."

  # ── Фиксации ─────────────────────────────────────────────────────────
  # Правило на конфликты фиксации пишется вместе с метрикой, которая его
  # питает: имя метрики и её лейблы выбирает тот, кто её заводит.
  #
  # Что здесь важно и что будет спрошено на ревью:
  #   * конфликт — это НЕ ошибка. Метрика конфликтов и метрика ошибок
  #     должны быть разными, иначе алерт на ошибки будет звенеть на
  #     штатной работе продукта, а рост конфликтов утонет в фоне;
  #   * алертит рост, а не факт. Конфликты есть всегда, их нормальный
  #     уровень — не ноль. Смысл имеет rate() и сравнение с обычным
  #     уровнем, а не «был хотя бы один»;
  #   * окно rate() должно пережить старт продаж корпуса: всплеск там
  #     штатный, и алерт обязан отличать его от поломки.
  #
  # Форма примерно такая (имена метрики и лейблов — твои):
  #
  # - name: fixation
  #   rules:
  #     - alert: FixationConflictsSpike
  #       expr: rate(<метрика конфликтов>[5m]) > <порог>
  #       for: 10m
  #       labels:
  #         severity: warning
  #       annotations:
  #         summary: "Резкий рост конфликтов фиксации"
